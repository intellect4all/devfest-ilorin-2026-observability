# Dashboards are JSON files in grafana/dashboards/ (the repo's grafana/ folder
# is mounted at /devfest/grafana).
apiVersion: 1

providers:
  - name: devfest
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 5
    options:
      path: /devfest/grafana/dashboards
      foldersFromFilesStructure: false
